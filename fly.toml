# fly.toml app configuration for FacilitoTools

app = 'facilitotools'
primary_region = 'gru'

[build]

[env]
  FIREBASE_CLIENT_EMAIL = ''
  FIREBASE_PRIVATE_KEY = ''
  FIREBASE_PROJECT_ID = ''
  FIREBASE_SERVICE_ACCOUNT = ''
  HOST_URL = 'https://www.masitaprex.com'
  RECAPTCHA_CLAVE_SECRETA = ''
  RESEND_API_KEY = ''
  CHECKOUT_REMINDER_DELAY_MINUTES = '5'
  SLACK_WEBHOOK_URL = ''
  TELEGRAM_BOT_TOKEN = ''

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # El worker de checkout necesita al menos una máquina viva para ejecutar
  # el recordatorio aun cuando el usuario cierre la página.
  min_machines_running = 1
  processes = ['app']

  # Margen de gracia corto para permitir un apagado limpio e inmediato (5 segundos)
  kill_signal = 'SIGINT'
  kill_timeout = '5s'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '512mb'
