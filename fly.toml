# fly.toml app configuration file generated for masitaprexv2

app = 'masitaprexv2'
primary_region = 'iad'

[build]

[env]
  FIREBASE_CLIENT_EMAIL = ''
  FIREBASE_PRIVATE_KEY = ''
  FIREBASE_PROJECT_ID = ''
  FIREBASE_SERVICE_ACCOUNT = ''
  HOST_URL = 'https://www.masitaprex.com'
  RECAPTCHA_CLAVE_SECRETA = ''
  RESEND_API_KEY = ''
  SLACK_WEBHOOK_URL = ''
  TELEGRAM_BOT_TOKEN = ''

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # Margen de gracia corto para permitir un apagado limpio e inmediato (5 segundos)
  kill_signal = 'SIGINT'
  kill_timeout = '5s'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '512mb'
